# Game lines at every US sportsbook (The Odds API) and kickoff weather forecasts (Open-Meteo, free).
#
# Game lines: one call returns spreads, totals and moneylines for every game at every book = 3 credits.
#   Runs Mon/Wed/Fri/Sun mornings: ~13 calls a month = ~40 credits. With the props schedule (~420)
#   that stays under the free plan's 500.
# Weather: free, every 6 hours, outdoor stadiums only.
name: Fetch game lines and weather

on:
  schedule:
    - cron: "5 */6 * * *"          # weather only (free)
    - cron: "10 14 * * 0,1,3,5"    # game lines + weather: Sun/Mon/Wed/Fri ~9 AM CDT
  workflow_dispatch:
    inputs:
      game_lines:
        description: "Also fetch game lines from The Odds API (3 credits)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-props
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy requests
      - name: Weather
        run: python run.py fetch-weather
      - name: Game lines
        if: github.event.schedule == '10 14 * * 0,1,3,5' || inputs.game_lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run.py fetch-games
      - name: Commit
        run: |
          git config user.name "Rat Report data bot"
          git config user.email "actions@users.noreply.github.com"
          git add weather.csv game_lines.csv 2>/dev/null || git add weather.csv
          git diff --cached --quiet && exit 0
          git commit -m "Weather / game lines $(TZ=America/Chicago date '+%a %b %-d, %-I:%M %p') CT"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done
          exit 1
