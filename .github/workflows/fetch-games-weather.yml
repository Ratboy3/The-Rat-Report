# Game lines at every US sportsbook (The Odds API) and kickoff weather forecasts (Open-Meteo, free).
#
# Game lines now come every hour from fetch-props.yml (paid plan, Oct 27, 2026); this workflow pulls them only on
#   a manual run.
# Weather: free, every 6 hours, and every hour on game days (Thu, Sun, Mon), outdoor stadiums only.
name: Fetch game lines and weather

on:
  schedule:
    - cron: "5 */6 * * *"          # weather only (free)
    - cron: "35 * * * 0,1,4,5"     # weather hourly on game days (UTC Sun/Mon/Thu/Fri covers CT Sun, Mon and Thu nights; free)
  workflow_dispatch:
    inputs:
      game_lines:
        description: "Also fetch game lines from The Odds API (3 credits)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-props
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy requests
      - name: Weather
        run: python run.py fetch-weather
      - name: Game lines
        if: inputs.game_lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run.py fetch-games
      - name: Commit
        run: |
          git config user.name "Rat Report data bot"
          git config user.email "actions@users.noreply.github.com"
          git add weather.csv game_lines.csv game_lines_history.csv 2>/dev/null || git add weather.csv game_lines.csv 2>/dev/null || git add weather.csv
          git diff --cached --quiet && exit 0
          git commit -m "Weather / game lines $(TZ=America/Chicago date '+%a %b %-d, %-I:%M %p') CT"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done
          exit 1
