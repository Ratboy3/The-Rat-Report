# Pulls live player props from The Odds API: DraftKings -> prop_lines.csv, every US book -> prop_books.csv
# (all books come back in the same call, so comparing books costs no extra credits).
# The API key lives in the repo secret ODDS_API_KEY (Settings > Secrets and variables > Actions).
# The hourly Rat Report update reads prop_lines.csv from this repo on its next run.
#
# Sized for the Odds API FREE plan (500 credits/month). Each game costs 6 credits per fetch, and
# each run only fetches games kicking off within the next 12 hours, so a week costs about
# 6 (Thu) + 84 (Sun) + 6 (Mon) = ~96 credits, roughly 420 a month. Manual runs also use the
# 12-hour window unless you change "hours"; a manual run of the whole week costs ~90 credits.
name: Fetch DraftKings props

on:
  schedule:
    - cron: "20 15 * * 0"   # Sun 10:20 AM CDT / 9:20 AM CST
    - cron: "30 19 * * 4"   # Thu 2:30 PM CDT / 1:30 PM CST
    - cron: "30 19 * * 1"   # Mon 2:30 PM CDT / 1:30 PM CST
  workflow_dispatch:
    inputs:
      hours:
        description: "Only games kicking off within this many hours (each game costs 6 credits)"
        default: "12"

permissions:
  contents: write

concurrency:
  group: fetch-props
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy requests
      - name: Fetch props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run.py fetch-props --hours "${{ inputs.hours || '12' }}"
      - name: Commit
        run: |
          git config user.name "Rat Report props bot"
          git config user.email "actions@users.noreply.github.com"
          git add prop_lines.csv prop_books.csv
          git diff --cached --quiet && exit 0
          git commit -m "Props from The Odds API $(TZ=America/Chicago date '+%a %b %-d, %-I:%M %p') CT"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done
          exit 1
