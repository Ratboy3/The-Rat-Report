# The Odds API pulls on the paid 20K plan (20,000 credits/month; upgraded Oct 27, 2026).
# Runs every hour; `python run.py fetch-plan` decides what to pull at that Central time (see odds_api.fetch_plan):
#   game lines, all books + Pinnacle: every hour 6 AM-11 PM CT (3 credits each)
#   props, every game this week: Wed-Sat at 9 AM, 4 PM, 9 PM CT (6 credits per game)
#   props, all of Sunday's games: Sunday 7 AM CT
#   props for games kicking off within 3 hours: every other hour 6 AM-11 PM CT (inactives, late moves)
# Expected ~7,500 credits a month; below 1,500 credits left only the near-kickoff pulls run.
# Runs at :20 so the hourly Rat Report update (~:50) starts from fresh prices. GitHub can start scheduled runs late.
# The API key lives in the repo secret ODDS_API_KEY.
name: Fetch DraftKings props

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Manual props pull: only games kicking off within this many hours (6 credits per game)"
        default: "12"
      game_lines:
        description: "Also fetch game lines (3 credits)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fetch-props
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy requests
      - name: Scheduled pulls
        if: github.event_name == 'schedule'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run.py fetch-plan
      - name: Manual props pull
        if: github.event_name == 'workflow_dispatch'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run.py fetch-props --hours "${{ inputs.hours }}"
      - name: Manual game lines
        if: github.event_name == 'workflow_dispatch' && inputs.game_lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run.py fetch-games
      - name: Commit
        run: |
          git config user.name "Rat Report props bot"
          git config user.email "actions@users.noreply.github.com"
          git add prop_lines.csv prop_books.csv game_lines.csv prop_books_history.csv game_lines_history.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Props and game lines from The Odds API $(TZ=America/Chicago date '+%a %b %-d, %-I:%M %p') CT"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done
          exit 1
